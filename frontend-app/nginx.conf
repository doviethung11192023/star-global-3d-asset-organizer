server {
    # Railway inject PORT vào biến môi trường, envsubst thay thế
    listen      ${PORT};

    root        /usr/share/nginx/html;
    index       index.html;

    # ── Proxy ngược cho API ──
    # Browser gọi /api/v1/... → chuyển tiếp tới backend
    # QUAN TRỌNG: KHÔNG set Host header (Nginx tự động lấy từ proxy_pass URL)
    # Nếu set Host = $host (frontend URL), Railway mesh sẽ route ngược về → loop 508
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback ──
    # Cho phép React Router xử lý đường dẫn (nếu có)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
