server {
    # Railway inject PORT vào biến môi trường, envsubst thay thế ${BACKEND_URL}
    listen      8080;

    root        /usr/share/nginx/html;
    index       index.html;

    # ── Proxy ngược cho API ──
    # Khi browser gọi /api/v1/organize-assets → chuyển tiếp tới backend
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback ──
    # Cho phép React Router xử lý đường dẫn (nếu có)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
